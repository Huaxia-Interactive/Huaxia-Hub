<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Huaxia Web</title>
  <link href="https://unpkg.com/lucide-static/font/lucide.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="webstyle.css">
  <link rel="icon" href="../../huaxia_hub_logo.jpg" type="image/x-icon" style="border-radius: 12px;"/>
</head>
<body>
  <div class="topbar">
    <button class="nav-btn" onclick="goBack()">&#x2190;</button>
    <button class="nav-btn" onclick="goForward()">&#x2192;</button>
    <button class="nav-btn" onclick="reload()">↻</button>
    <input id="url" class="urlbar" type="text" placeholder="Enter URL or search">
    <button class="nav-btn" onclick="window.location.href='../../programs.html'">Back</button>
  </div>

  <div class="tabs" id="tabs">
    <button id="newTabBtn" class="nav-btn"><i class="lucide-plus"></i></button>
  </div>

  <iframe id="browser" src="about:blank"></iframe>

  <script>
    const iframe = document.getElementById("browser")
    const urlBar = document.getElementById("url")
    const tabsContainer = document.getElementById("tabs")
    const newTabBtn = document.getElementById("newTabBtn")
    let currentTab = null

    // Navigation history tracking for tabs
    let tabHistory = [];
    let tabHistoryIndex = -1;

    function setIframeSrc(url) {
      iframe.src = url;
      urlBar.value = url;
    }

    function goBack() {
      if (tabHistoryIndex > 0) {
        tabHistoryIndex--;
        setIframeSrc(tabHistory[tabHistoryIndex]);
      }
    }
    function goForward() {
      if (tabHistoryIndex < tabHistory.length - 1) {
        tabHistoryIndex++;
        setIframeSrc(tabHistory[tabHistoryIndex]);
      }
    }
    function reload() {
      setIframeSrc(tabHistory[tabHistoryIndex] || "about:blank");
    }

    function createTab(url = "about:blank") {
      const island = document.createElement("div")
      island.className = "tab-island"

      const tab = document.createElement("div")
      tab.className = "tab active"
      tab.textContent = url === "about:blank" ? "New Tab" : url

      const closeBtn = document.createElement("button")
      closeBtn.className = "close-btn"
      closeBtn.innerHTML = "✕"
      closeBtn.onclick = (e) => {
        e.stopPropagation()
        closeTab(island, tab)
      }

      tab.onclick = () => switchTab(url, tab)

      island.appendChild(tab)
      island.appendChild(closeBtn)
      tabsContainer.insertBefore(island, newTabBtn)
      switchTab(url, tab)
      // Reset history for new tab
      tabHistory = [url];
      tabHistoryIndex = 0;
    }

    function switchTab(url, el) {
      setIframeSrc(url);
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"))
      el.classList.add("active")
      currentTab = el
    }

    function closeTab(island, tab) {
      const isActive = tab.classList.contains("active")
      island.remove()
      if (isActive) {
        const nextTab = tabsContainer.querySelector(".tab")
        if (nextTab) {
          nextTab.click()
        } else {
          iframe.src = "about:blank"
          urlBar.value = ""
          currentTab = null
        }
      }
    }

    urlBar.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        let url = urlBar.value.trim()
        if (!url.startsWith("http")) {
          url = "https://duckduckgo.com/?q=" + encodeURIComponent(url)
        }
        setIframeSrc(url);
        // Only push if new or changed
        if (tabHistory[tabHistoryIndex] !== url) {
          tabHistory = tabHistory.slice(0, tabHistoryIndex + 1);
          tabHistory.push(url);
          tabHistoryIndex = tabHistory.length - 1;
        }
        createTab(url)
      }
    })

    newTabBtn.addEventListener("click", () => createTab())

    createTab()
  </script>
</body>
</html>
