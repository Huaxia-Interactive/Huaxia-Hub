  <style>
    :root {
      --gap: 15px;
    }

    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .home-screen {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);  
      gap: var(--gap);
      width: 90vw;
      max-width: 400px;
      aspect-ratio: 3 / 2; 
    }

    .app-button {
      background: #0077ff;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
      font-family: 'Inter', sans-serif;
    }

    .app-button:hover {
      transform: scale(1.05);
    }

    .nav-btn {
      background: #0077ff;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
      font-family: 'Inter', sans-serif;
      max-width: 100px;
      max-height: 40px;
    }

  </style>
</head>
